<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="德中字幕">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>DeZhLive 德中即時字幕</title>
<style>
  :root { --bg:#111318; --panel:#1b1e25; --fg:#f2f2f4; --muted:#8b90a0; --accent:#ff5fa2; --err:#ff7a7a; --zh:22px; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  body { display:flex; flex-direction:column; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  header { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid #262a33; }
  header h1 { font-size:16px; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #status { font-size:12px; color:var(--muted); padding:4px 12px; min-height:20px; }
  #status.err { color:var(--err); }
  #list { flex:1; overflow-y:auto; padding:8px 12px 24px; -webkit-overflow-scrolling:touch; }
  .row { padding:10px 0; border-bottom:1px solid #20232b; }
  .de { color:var(--muted); font-size:14px; line-height:1.4; margin-bottom:4px; }
  .zh { font-size:var(--zh); line-height:1.5; }
  .pending { color:var(--muted); font-style:italic; }
  .row.err .zh { color:var(--err); font-size:15px; }
  body.hide-de .de { display:none; }
  footer { display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid #262a33; background:var(--panel); }
  button { font:inherit; border:0; border-radius:10px; padding:10px 14px; background:#2a2e38; color:var(--fg); }
  button.primary { background:var(--accent); color:#111; font-weight:600; flex:1; font-size:17px; }
  button.primary.on { background:#3a3e48; color:var(--fg); }
  .icon { padding:8px 10px; background:transparent; font-size:20px; }
  #meter { width:10px; height:10px; border-radius:50%; background:#444; transition:background .1s; }
  #meter.speech { background:#4cd964; }
  dialog { background:var(--panel); color:var(--fg); border:1px solid #333; border-radius:14px; width:min(560px, 94vw); max-height:88vh; padding:16px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input, select, textarea { width:100%; font:inherit; font-size:16px; background:#111318; color:var(--fg); border:1px solid #333; border-radius:8px; padding:8px; }
  textarea { min-height:90px; }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; line-height:1.4; }
  .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }
  #cost { font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <div id="meter" title="收音"></div>
  <h1>德中即時字幕</h1>
  <span id="cost"></span>
  <button class="icon" id="btnDe" title="顯示/隱藏原文">De</button>
  <button class="icon" id="btnSettings" title="設定">⚙️</button>
</header>
<div id="status"></div>
<main id="list"></main>
<footer>
  <button id="btnExport">匯出</button>
  <button id="btnClear">清除</button>
  <button class="primary" id="btnStart">開始</button>
</footer>

<dialog id="dlg">
  <form method="dialog">
    <h2 style="margin:0 0 4px;font-size:18px">設定</h2>
    <label>服務</label>
    <select id="sProv"><option value="gemini">Google Gemini</option><option value="openai">OpenAI</option></select>
    <div id="boxG">
      <label>Gemini API 金鑰</label>
      <input id="sGkey" type="password" autocomplete="off" placeholder="AIza...">
      <div class="hint">到 aistudio.google.com 建立。請用已開通付費（含 Google AI Pro 每月額度）的專案：免費方案的內容會被 Google 用來改進產品。</div>
      <label>Gemini 模型</label>
      <select id="sGmodel">
        <option value="gemini-3.8-flash">gemini-3.8-flash（建議，品質好）</option>
        <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite（最便宜、最快）</option>
        <option value="gemini-4-hydrogen">gemini-4-hydrogen（最新，較貴）</option>
      </select>
    </div>
    <div id="boxO">
      <label>OpenAI API 金鑰</label>
      <input id="sKey" type="password" autocomplete="off" placeholder="sk-...">
    </div>
    <div class="hint">金鑰只存在這支手機的瀏覽器裡，直接送到該服務，不經過其他伺服器。建議設每月花費上限。</div>
    <label>演講語言</label>
    <select id="sLang">
      <option value="de">德文</option><option value="en">英文</option><option value="fr">法文</option>
      <option value="es">西班牙文</option><option value="it">義大利文</option><option value="nl">荷蘭文</option>
      <option value="ja">日文</option><option value="ko">韓文</option>
    </select>
    <label>會議主題（幫助辨識與翻譯專有名詞）</label>
    <textarea id="sTopic"></textarea>
    <label>詞彙表（原文=中文，用分號或換行分隔）</label>
    <textarea id="sGloss" style="min-height:140px"></textarea>
    <div class="btns" style="justify-content:flex-start;margin-top:8px">
      <button type="button" id="btnClearPreset">清空主題與詞彙</button>
      <button type="button" id="btnMedPreset">還原乳癌醫學預設</button>
    </div>
    <div class="hint">換成非醫學會議時：按「清空」，再填一句新主題（例如「Elternabend in der Grundschule」或「Firmenmeeting über Budget」）效果最好。</div>
    <label>字體大小</label>
    <input id="sFont" type="range" min="16" max="34" step="1">
    <details style="margin-top:12px">
      <summary style="color:var(--muted);font-size:13px">進階：OpenAI 模型與斷句</summary>
      <label>語音辨識模型</label><input id="sAsr">
      <label>翻譯模型</label><input id="sMt">
      <label>翻譯推理強度（none 最快）</label>
      <select id="sEffort"><option>none</option><option>low</option><option>medium</option></select>
      <label>斷句靜音長度（毫秒）</label><input id="sSil" type="number" min="300" max="2000" step="100">
    </details>
    <div class="btns">
      <button value="cancel">取消</button>
      <button value="save" class="primary" style="flex:0">儲存</button>
    </div>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
